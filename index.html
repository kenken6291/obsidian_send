<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1b22">
<title>健二保管庫 | 送信</title>
<style>
  :root{
    --bg: #16151b;
    --panel: #1e1d26;
    --ink: #e8e6f0;
    --ink-dim: #8b899c;
    --accent: #8b6ef2;
    --accent-dim: #4d3f8f;
    --line: #2c2b38;
    --good: #6ed49a;
    --bad: #e26d6d;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .mark{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .mark svg{ flex:none; }
  h1{
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin:0;
  }
  .sub{
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 16px 16px 0;
    min-height:0;
  }

  .field{
    flex:1;
    display:flex;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    transition: border-color .15s ease;
  }
  .field:focus-within{
    border-color: var(--accent-dim);
  }
  textarea{
    flex:1;
    width:100%;
    border:0;
    outline:0;
    resize:none;
    background: transparent;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.65;
    padding: 16px;
    font-family: inherit;
  }
  textarea::placeholder{ color: #56546a; }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 10px 4px 4px;
    font-size: 12px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .meta-row button{
    background:none;
    border:0;
    color: var(--ink-dim);
    font-size: 12px;
    padding: 4px 6px;
    cursor:pointer;
  }
  .meta-row button:active{ color: var(--ink); }

  footer{
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
  }

  .status{
    min-height: 18px;
    font-size: 12.5px;
    text-align:center;
    margin-bottom: 10px;
    transition: opacity .2s ease;
  }
  .status.ok{ color: var(--good); }
  .status.err{ color: var(--bad); }
  .status.hidden{ opacity:0; }

  .send-btn{
    width:100%;
    padding: 16px;
    border-radius: 14px;
    border: 0;
    background: var(--accent);
    color: #100e18;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor:pointer;
    transition: transform .08s ease, opacity .15s ease, background .15s ease;
  }
  .send-btn:active{ transform: scale(0.98); }
  .send-btn:disabled{
    background: var(--accent-dim);
    color: #a89ee0;
    cursor: default;
  }

  .spinner{
    display:inline-block;
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #100e18;
    animation: spin .7s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z" stroke="#8b6ef2" stroke-width="1.6" fill="none"/>
      <path d="M12 2 L12 22 M4 7 L20 17 M20 7 L4 17" stroke="#4d3f8f" stroke-width="1" opacity="0.6"/>
    </svg>
    <h1>健二保管庫</h1>
  </div>
  <p class="sub">思いついたことをそのまま送る。整形とタグ付けはAIが行う。</p>
</header>

<main>
  <div class="field">
    <textarea id="text" placeholder="ここに入力…" autofocus></textarea>
  </div>
  <div class="meta-row">
    <span id="count">0文字</span>
    <button type="button" id="clearBtn">クリア</button>
  </div>
</main>

<footer>
  <div id="status" class="status hidden"></div>
  <button id="sendBtn" class="send-btn">保管庫へ送る</button>
</footer>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxfyTzFRWFpDRmjqNZHJXcTogI54B8nBTmmBWJ33s88TItEnVBhbqome3uGFC4bmXhY/exec";
  const DRAFT_KEY = "kenji-souko-draft";

  const textEl = document.getElementById("text");
  const countEl = document.getElementById("count");
  const clearBtn = document.getElementById("clearBtn");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");

  // 下書き復元（送信失敗・誤タップ対策）
  try{
    const saved = localStorage.getItem(DRAFT_KEY);
    if (saved) textEl.value = saved;
  }catch(e){}
  updateCount();

  textEl.addEventListener("input", () => {
    updateCount();
    try{ localStorage.setItem(DRAFT_KEY, textEl.value); }catch(e){}
  });

  function updateCount(){
    countEl.textContent = textEl.value.length + "文字";
  }

  clearBtn.addEventListener("click", () => {
    textEl.value = "";
    updateCount();
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    textEl.focus();
  });

  function setStatus(msg, kind){
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  sendBtn.addEventListener("click", async () => {
    const text = textEl.value.trim();
    if (!text){
      setStatus("テキストが空です", "err");
      return;
    }

    sendBtn.disabled = true;
    sendBtn.innerHTML = '<span class="spinner"></span>送信中…';
    setStatus("", "hidden");

    try{
      const res = await fetch(GAS_URL, {
        method: "POST",
        // text/plain にすることでプリフライトを回避（GAS側はcontentsを生JSONとして読む）
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ text })
      });
      const result = await res.text();

      if (result.startsWith("Success")){
        setStatus("保管庫に保存しました ✓", "ok");
        textEl.value = "";
        updateCount();
        try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
      } else {
        setStatus(result || "保存に失敗しました", "err");
      }
    } catch(err){
      setStatus("通信エラー: " + err.message, "err");
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "保管庫へ送る";
    }
  });
</script>

</body>
</html>
